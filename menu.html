<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grainy Delights</title>
    <link rel="stylesheet" href="modals.css">
    <script src="script.js"></script> 
</head>
<body>
 
    <!-- Header Section -->
    <header>
        <div class="logo-group">
            <span class="hamburger-menu" onclick="openNav()">&#9776;</span>
            <img src="images/bread.png" alt="Shop Logo" class="logo-image" onclick="window.location.href='index.html';">
            <div class="logo">Grainy Delights</div>
        </div>

    <!-- Right Side Icons -->
    <div class="header-icons">
        <div class="search-container" style="display: flex; align-items: center; gap: 5px;">
            <img src="images/search.png" alt="Search_Icon" class="search-icon" onclick="openSearch()">
        </div>
        <div class="cart-icon-wrapper">
            <img src="images/cart.png" alt="Shopping Cart" class="svg-icon" onclick="openCart()">
            <span id="cart-count">0</span>
        </div>
    </div>
    </header>
 
    <!-- Side Navigation -->
    <div id="mySidenav" class="sidenav">
    <a href="javascript:void(0)" class="closebtn" onclick="closeNav()">&times;</a>
    <a href="index.html">Home</a>
    <a href="menu.html">Menu</a>
    <a href="https://www.facebook.com/">Contact Us</a>
        <div class="sidenav-logo">
            <img src="images/bread.png" alt="Grainy Delights Logo" class="logo-image">
            <span class="logo">Grainy Delights</span>
        </div>
    </div>

    <!-- Shopping Cart -->
    <div id="cartModal" class="cart-modal">
        <div class="cart-content">
            <span class="close-cart" onclick="closeCart()">&times;</span>
            <h2>Your Shopping Cart</h2>
            <div id="cartItems"></div>
            <div class="cart-total">
                <strong>Total: </strong><span id="cartTotal">₱0.00</span>
            </div>
            <button class="checkout-btn" onclick="checkout()">Checkout</button>
        </div>
    </div>

    <!-- Search Bar -->
    <div id="searchModal" class="search-modal">
        <div class="search-content">
            <span class="close-search" onclick="closeSearch()">&times;</span>
            <h2>Search Products</h2>
            <input type="text" id="searchInput" placeholder="What are you craving today?" onkeyup="filterProducts(this.value)" style="padding: 5px 10px; border-radius: 4px; border: 1px solid #ccc; font-size: 14px;">
            </div>
        </div>
    </div>

    <!-- Main Products Section -->
    <main class="test_background">
        <br><br>
        <h2 class="headline-text">Featured Products</h2>
        <div class="product-grid">

            <!-- Product 1 -->
            <div class="product-card">
                <img src="images/ensaymada.png" alt="Ensaymada" class="product-image">
                <h3 class="product-title">Ensaymada</h3>
                <p class="product-price">₱50.00</p>
                <button class="add-to-cart-btn" onclick="addToCart('Ensaymada', 50.00)">Add to Cart</button>
            </div>

            <!-- Product 2 -->
            <div class="product-card">
                <img src="images/Hopia.png" alt="Hopia" class="product-image">
                <h3 class="product-title">Hopia</h3>
                <p class="product-price">₱65.00</p>
                <button class="add-to-cart-btn" onclick="addToCart('Hopia', 65.00)">Add to Cart</button>
            </div>
 
            <!-- Product 3 -->
            <div class="product-card">
                <img src="images/Buko_Pie.png" alt="Buko Pie" class="product-image">
                <h3 class="product-title">Buko Pie</h3>
                <p class="product-price">₱500.00</p>
                <button class="add-to-cart-btn" onclick="addToCart('Buko Pie', 500.00)">Add to Cart</button>
            </div>
        
            <!-- Product 4 -->
            <div class="product-card">
                <img src="images/otap.png" alt="Otap" class="product-image">
                <h3 class="product-title">Otap</h3>
                <p class="product-price">₱100.00</p>
                <button class="add-to-cart-btn" onclick="addToCart('Otap', 100.00)">Add to Cart</button>
            </div>

            <!-- Product 5 -->
            <div class="product-card">
                <img src="images/piaya.png" alt="Piaya" class="product-image">
                <h3 class="product-title">Piaya</h3>
                <p class="product-price">₱55.00</p>
                <button class="add-to-cart-btn" onclick="addToCart('Piaya', 55.00)">Add to Cart</button>
            </div>

             <!-- Product 6 -->
            <div class="product-card">
                <img src="images/pandesal.png" alt="Classic Pandesal" class="product-image">
                <h3 class="product-title">Classic Pandesal</h3>
                <p class="product-price">₱30.00</p>
                <button class="add-to-cart-btn" onclick="addToCart('Classic Pandesal', 30.00)">Add to Cart</button>
            </div>
        </div>
    </main>
 
    <!-- Footer Section -->
    <footer>
        <p>&copy; 2026 Grainy Delights. All rights reserved.</p>
        <div class="footer-icons">
            <img src="images/twitter.png" alt="Twitter_Icon" class="svg-icon" onclick="window.location.href='https://x.com/home';">
            <img src="images/facebook.png" alt="Facebook_Icon" class="svg-icon" onclick="window.location.href='https://www.facebook.com/';">
        </div>
    </footer>

<!-- Toast Notification Container -->
    <div id="toast-notification" class="toast"></div>
    
</body>
</html>
